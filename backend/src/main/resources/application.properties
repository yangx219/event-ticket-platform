spring.application.name=tickets

# Database Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changemeinprod!}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway owns all database schema changes. Baseline version 0 safely adopts the
# existing local schema; migration V1 then records and validates the first schema.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/event-ticket-platform}

# AI copy assistant. Secrets are read from the environment and never sent to the browser.
eventpilot.ai.enabled=${EVENTPILOT_AI_ENABLED:false}
eventpilot.ai.api-key=${OPENAI_API_KEY:}
eventpilot.ai.model=${OPENAI_MODEL:gpt-4.1-mini}
eventpilot.ai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
eventpilot.ai.timeout=${OPENAI_TIMEOUT:20s}
eventpilot.ai.rate-limit.requests=${AI_RATE_LIMIT_REQUESTS:5}
eventpilot.ai.rate-limit.window=${AI_RATE_LIMIT_WINDOW:1m}
